<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="wireframe-title wireframe-description">
  <title id="wireframe-title">Boxed home page wireframes</title>
  <desc id="wireframe-description">Black-and-white mobile and desktop layouts of the Boxed game website home page.</desc>
  <style>
    text { fill: #000; font-family: Arial, sans-serif; }
    .frame { fill: #fff; stroke: #000; stroke-width: 3; }
    .screen { fill: #fff; stroke: #000; stroke-width: 2; }
    .rule { stroke: #000; stroke-width: 1.5; }
    .heavy { stroke: #000; stroke-width: 3; }
    .section-label { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    .small { font-size: 13px; }
    .body { font-size: 15px; }
    .heading { font-size: 19px; font-weight: 700; }
    .hero-title { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .muted { font-size: 12px; }
  </style>

  <text x="55" y="48" class="section-label">BOXED / HOME PAGE STRUCTURE</text>
  <line x1="55" y1="64" x2="1145" y2="64" class="heavy" />

  <text x="72" y="100" class="section-label">SMALL / MOBILE</text>
  <text x="420" y="100" class="section-label">LARGE / TABLET + DESKTOP</text>

